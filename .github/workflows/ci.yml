name: Linux build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional mocha spec selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        # mocha nolonger supports node 10
        node-version: [12.x, 14.x, 16.x, 18.x, 20.x, 21.x, 22.x]

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: |
          npm install

      - name: Run Tests
        run: |
          npm test -- ${{ inputs.test-filter }}

      - name: Pack release tarball
        if: matrix.node-version == '22.x'
        run: |
          npm pack

      - name: Upload release tarball
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: adm-zip-*.tgz
          if-no-files-found: error
